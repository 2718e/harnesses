# Read-only data volumes for the Pi container.
#
# Enable this override when a session needs data the agent may read but must
# not modify or delete (e.g. analysis datasets). Compose merges this file with
# compose.yaml, so it changes nothing unless you pass it explicitly:
#
#   # either export it in the shell, or set DATASETS_DIR in pi/.env
#   export DATASETS_DIR=/media/dan/data/dev/datasets/test
#   docker compose -f compose.yaml -f compose.ro.yaml up -d
#
# Add more mounts by copying the line. The `:ro` suffix is what makes a volume
# read-only inside the container; drop it if a dataset must be writable.
#
# Note: multi-file compose merges append volume entries — they do not replace
# the ones in compose.yaml.

services:
  pi:
    volumes:
      - ${DATASETS_DIR:?DATASETS_DIR must be set, see pi/.env.example}:/workspace/datasets:ro
