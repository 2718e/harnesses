# Generic Lima VM definition for the agent harnesses.
# Host-specific mounts live in mountavm.yaml; see mountavm.example.yaml.
# Host prerequisite: the Rust virtiofsd (Debian: sudo apt install virtiofsd).
# If virtiofsd is unavailable, change mountType to 9p.

base:
  - template:_images/debian-13

vmType: qemu
cpus: 4
memory: 8GiB
disk: 60GiB

# Docker manages its own containerd in the guest.
containerd:
  user: false
  system: false

# Created separately with `just create-db-disk`; it survives VM deletion.
# Keep the name short: older Lima versions have an ext4 label length bug.
additionalDisks:
  - name: pgdata
    format: true
    fsType: ext4

mountType: virtiofs
mountInotify: true

portForwards:
  # Lima otherwise forwards guest loopback ports to host loopback by default.
  - guestPort: 5432
    ignore: true
  # Codex browser-login callback (host browser -> guest Codex).
  - guestPort: 1455
    hostPort: 1455
    hostIP: 127.0.0.1

provision:
  - mode: system
    file: ./provision/system.sh
  - mode: user
    file: ./provision/user.sh
